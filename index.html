<!DOCTYPE html>
<html>
<head>
  <title>TomasEarn - Iba Videá</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="text-align:center; font-family:sans-serif; padding:20px;">
  <h1>TomasEarn</h1>
  <h2>Pozri video a získaj coiny</h2>
  
  <button id="videoBtn" style="padding:20px 40px; font-size:20px; background:#00c853; color:white; border:0; border-radius:10px;">
    ▶️ POZRIEŤ VIDEO
  </button>

  <div id="offerwall" style="margin-top:20px; display:none;">
    <iframe id="ayetFrame" style="width:100%; height:700px; border:0; border-radius:10px;"></iframe>
  </div>

<script>
  // Vygeneruje ID pre používateľa alebo použije existujúce
  let userId = localStorage.getItem('tomasearn_user');
  if(!userId){
    userId = 'user_' + Math.random().toString(36).substring(2,9);
    localStorage.setItem('tomasearn_user', userId);
  }

  document.getElementById('videoBtn').onclick = function(){
    // TOTO JE TVOJA URL - 25644 - IBA VIDEÁ (IAA callback je zapnutý)
    const url = `https://www.ayetstudios.com/offers/web_offerwall/25644?external_identifier=${userId}`;
    document.getElementById('ayetFrame').src = url;
    document.getElementById('offerwall').style.display = 'block';
    window.scrollTo(0, 600);
  }
</script>
</body>
</html>
