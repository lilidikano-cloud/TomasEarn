<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TomasEarn - ayeT $0.005 / video</title>
<meta name="theme-color" content="#7a5cf6">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#f8f9ff;min-height:100vh;padding-bottom:90px}
.top{background:#7a5cf6;border-radius:0 0 32px 32px;padding:24px 20px 28px;color:white}
.balance{font-size:11px;letter-spacing:0.14em;opacity:0.7;margin-bottom:6px}
.balance-value{font-size:32px;font-weight:800}
.card{background:white;border-radius:20px;padding:18px;margin:16px;box-shadow:0 8px 30px rgba(122,92,246,0.08)}
.launch{width:100%;background:#1a1a2e;color:white;border:none;border-radius:16px;padding:18px;font-size:16px;font-weight:700;cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #f0f0ff;display:flex;padding:10px 0;z-index:50}
.nav-item{flex:1;text-align:center;font-size:10px;color:#b8bed3;cursor:pointer}
.nav-item.active{color:#7a5cf6}
.input{width:100%;background:#f1f2f8;border:1px solid #ececff;border-radius:12px;padding:12px 14px;margin-top:8px}
.tab{display:none}.tab.active{display:block}
</style>
</head>
<body>
<div id="home" class="tab active">
  <div class="top">
    <div class="balance">BALANCE</div>
    <div class="balance-value" id="balance">$0.0000000</div>
  </div>
  <div class="card">
    <button class="launch" onclick="launch()">LAUNCH</button>
    <div style="text-align:center;margin-top:10px;font-size:11px;color:#9aa0b6">BEZ LIMITU - ID: 4096893 / 25622</div>
  </div>
</div>
<script>
const AYET_PUBLISHER_ID = "4096893";
const AYET_APP_ID = "25622";
const AYET_RATE = 0.005;
let balance = parseFloat(localStorage.getItem('te_balance')||'0');
let videos = parseInt(localStorage.getItem('te_videos')||'0');
function updateUI(){document.getElementById('balance').textContent='$'+balance.toFixed(7)}
function launch(){
  ayetEarn();
  balance+=AYET_RATE; videos++;
  localStorage.setItem('te_balance',balance);
  localStorage.setItem('te_videos',videos);
  updateUI();
}
async function ayetEarn(){
  const userId = localStorage.getItem('te_user') || 'user_'+Math.random().toString(36).slice(2,8);
  localStorage.setItem('te_user',userId);
  const url = `https://www.ayetstudios.com/offers/web/25622?external_identifier=${userId}`;
  window.open(url,'_blank');
}
updateUI();
</script>
</body>
</html>
