<!DOCTYPE html>
<html lang="sk">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TomasEarn - Len Video</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:Inter,sans-serif;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#11111a;border-bottom:1px solid #222}
.logo{font-weight:900;font-size:20px;letter-spacing:1px}
.logo span{color:#a855f7}
.coins{background:#1e1e2e;border:1px solid #a855f7;padding:6px 14px;border-radius:20px;font-weight:700}
.coins b{color:#facc15}
.container{max-width:500px;margin:0 auto;padding:16px}
.video-box{background:#15151f;border-radius:16px;overflow:hidden;border:1px solid #222;margin-bottom:16px}
.video-box video{width:100%;aspect-ratio:16/9;background:#000}
.video-info{padding:12px}
.video-info h3{font-size:14px;margin-bottom:8px}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#a855f7,#7c3aed);border:none;border-radius:12px;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.5}
.progress{height:6px;background:#222;border-radius:3px;margin:10px 0;overflow:hidden}
.progress div{height:100%;background:#a855f7;width:0%;transition:width .3s}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.card{background:#15151f;border:1px solid #222;border-radius:12px;padding:14px;text-align:center}
.card h4{font-size:12px;opacity:.6;margin-bottom:6px}
.card p{font-size:18px;font-weight:800;color:#facc15}
.invite{background:#15151f;border:1px dashed #a855f7;border-radius:12px;padding:14px;margin-top:16px}
.invite input{width:100%;padding:10px;background:#0a0a0f;border:1px solid #333;border-radius:8px;color:#fff;margin:8px 0}
.withdraw{background:#15151f;border:1px solid #222;border-radius:12px;padding:14px;margin-top:16px}
.withdraw input,.withdraw select{width:100%;padding:12px;background:#0a0a0f;border:1px solid #333;border-radius:8px;color:#fff;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:20px;z-index:99}
.modal.active{display:flex}
.modal-box{background:#15151f;border:1px solid #333;border-radius:16px;padding:20px;width:100%;max-width:400px}
</style>
</head>
<body>
<div class="header">
<div class="logo">TOMAS<span>EARN</span></div>
<div class="coins">🪙 <b id="coinCount">0</b></div>
</div>
<div class="container">
<div class="video-box">
<video id="mainVideo" controls playsinline></video>
<div class="video-info">
<h3 id="videoTitle">Načítavam videá...</h3>
<div class="progress"><div id="prog"></div></div>
<button class="btn" id="watchBtn" disabled>Sleduj video a získaj 50 coinov</button>
</div>
</div>

<div class="cards">
<div class="card"><h4>Dnes zárobok</h4><p id="todayEarn">0</p></div>
<div class="card"><h4>Videa</h4><p id="videoCount">0</p></div>
</div>

<div class="invite">
<h4 style="margin-bottom:6px">🔗 Pozvi kamoša - zarobíš</h4>
<p style="font-size:12px;opacity:.7">1. úroveň 50% • 2. úroveň 25% • 3. úroveň 10%</p>
<input id="refLink" readonly>
<button class="btn" style="padding:10px;margin-top:8px" onclick="copyRef()">Kopírovať link</button>
<p style="font-size:12px;margin-top:8px">Tvoj kód: <b id="myCode" style="color:#a855f7"></b></p>
</div>

<div class="withdraw">
<h4>💸 Výber - LEN REAL</h4>
<p style="font-size:11px;opacity:.6;margin:6px 0">Min. 1000 coinov = 1€</p>
<select id="payType">
<option value="TRC20">USDT TRC20</option>
<option value="BTC">BTC</option>
<option value="PayPal">PayPal</option>
</select>
<input id="walletAddr" placeholder="Tvoja adresa / PayPal email">
<input id="withdrawAmount" type="number" placeholder="Počet coinov (min 1000)">
<button class="btn" onclick="requestWithdraw()">Požiadať o výber</button>
<div id="withdrawStatus" style="font-size:12px;margin-top:8px;opacity:.8"></div>
</div>
</div>

<div class="modal" id="rewardModal"><div class="modal-box" style="text-align:center">
<h2 style="color:#facc15">+50 coinov! 🎉</h2>
<p style="margin:12px 0;opacity:.8">Video pozreté</p>
<button class="btn" onclick="closeReward()">Pokračovať</button>
</div></div>

<script>
const WORKER_URL = "https://tomasearn-videa.lilidikano-cloud.workers.dev";
let coins = parseInt(localStorage.getItem('te_coins')||'0');
let videos = [];
let currentIdx = 0;
let watchedToday = parseInt(localStorage.getItem('te_watched')||'0');
let myCode = localStorage.getItem('te_code');
if(!myCode){myCode='TE'+Math.random().toString(36).substring(2,7).toUpperCase();localStorage.setItem('te_code',myCode);}
let refBy = new URLSearchParams(location.search).get('ref');

function updateUI(){
document.getElementById('coinCount').textContent=coins;
document.getElementById('todayEarn').textContent=watchedToday*50;
document.getElementById('videoCount').textContent=watchedToday;
document.getElementById('myCode').textContent=myCode;
document.getElementById('refLink').value=location.origin+location.pathname+'?ref='+myCode;
localStorage.setItem('te_coins',coins);
localStorage.setItem('te_watched',watchedToday);
}
updateUI();

async function loadVideos(){
try{
const r = await fetch(WORKER_URL+'/videos');
const data = await r.json();
videos = data.videos || data || [];
}catch(e){
videos = [{url:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",title:"Test Video - Big Buck Bunny"}];
}
if(videos.length>0) playVideo(0);
}
function playVideo(i){
currentIdx=i;
const v = videos[i];
const vid = document.getElementById('mainVideo');
vid.src = v.url || v.src;
document.getElementById('videoTitle').textContent = v.title || ('Video '+(i+1));
document.getElementById('watchBtn').disabled=true;
document.getElementById('prog').style.width='0%';
let rewarded=false;
vid.ontimeupdate=()=>{
if(vid.duration){
let p = (vid.currentTime/vid.duration)*100;
document.getElementById('prog').style.width=p+'%';
if(p>80 && !rewarded){
rewarded=true;
document.getElementById('watchBtn').disabled=false;
document.getElementById('watchBtn').textContent='Vyzdvihnúť 50 coinov';
}
}
};
}
document.getElementById('watchBtn').onclick=()=>{
coins+=50;
watchedToday++;
if(refBy){
let bonusInfo = {code:refBy,amount:50};
fetch(WORKER_URL+'/ref', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(bonusInfo)}).catch(()=>{});
}
updateUI();
document.getElementById('rewardModal').classList.add('active');
playVideo((currentIdx+1)%videos.length);
};
function closeReward(){document.getElementById('rewardModal').classList.remove('active'); document.getElementById('watchBtn').textContent='Sleduj video a získaj 50 coinov'; document.getElementById('watchBtn').disabled=true;}
function copyRef(){navigator.clipboard.writeText(document.getElementById('refLink').value); alert('Skopírované');}

async function requestWithdraw(){
const amt = parseInt(document.getElementById('withdrawAmount').value);
const addr = document.getElementById('walletAddr').value.trim();
const type = document.getElementById('payType').value;
const status = document.getElementById('withdrawStatus');
if(amt<1000){status.textContent='Min. 1000 coinov';return;}
if(coins<amt){status.textContent='Nemáš dosť coinov (máš '+coins+')';return;}
if(!addr){status.textContent='Zadaj adresu';return;}
status.textContent='Odosielam žiadosť...';
try{
const payload = {code:myCode, amount:amt, address:addr, type:type, coins:coins};
const res = await fetch(WORKER_URL+'/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
if(res.ok){
coins-=amt;
updateUI();
status.textContent='✅ Žiadosť odoslaná! Admin ti pošle '+ (amt/1000) +'€ na '+type+' do 24h. STATUS: PENDING';
document.getElementById('withdrawAmount').value='';
}else{
throw new Error();
}
}catch(e){
status.textContent='Uložené lokálne - admin to uvidí. STATUS: PENDING (offline)';
coins-=amt;
updateUI();
let pending = JSON.parse(localStorage.getItem('te_pending')||'[]');
pending.push({date:new Date().toISOString(),code:myCode,amount:amt,address:addr,type:type});
localStorage.setItem('te_pending',JSON.stringify(pending));
}
}
loadVideos();
</script>

ment(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
